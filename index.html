<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeoPilot — AI-Powered SEO Automation & Site Audit Platform</title>
  <meta name="description" content="SeoPilot automates technical audits, Google SERP monitoring, keyword tracking, and AI content diagnostics.">
  <link rel="canonical" href="https://jahidulislamseo.github.io/SeoPilot/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #080d18; color: #f8fafc; font-family: "Inter", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .card { background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 48px 32px; max-width: 580px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .badge { display: inline-block; padding: 4px 12px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 9999px; color: #34d399; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; }
    h1 { font-family: "Plus Jakarta Sans", sans-serif; font-size: 2.5rem; font-weight: 800; line-height: 1.2; margin-bottom: 16px; background: linear-gradient(135deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 1.05rem; line-height: 1.7; margin-bottom: 32px; }
    .btn-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 0.95rem; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #10b981, #0ea5e9); color: #fff; box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚡ Autonomous SEO Engine</div>
    <h1>SeoPilot</h1>
    <p>Full-stack autonomous SEO copilot and site audit dashboard. Continuously monitor SERP movements, Core Web Vitals, and keyword gaps.</p>
    <div class="btn-group">
      <a href="https://seo-pilot.vercel.app" target="_blank" class="btn btn-primary">Launch SeoPilot App (Vercel) ↗</a>
      <a href="https://github.com/jahidulislamseo/SeoPilot" target="_blank" class="btn btn-secondary">GitHub Repository</a>
    </div>
  </div>
</body>
</html>
